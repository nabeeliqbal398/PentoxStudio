services:
  db:
    image: pgvector/pgvector:pg17
    container_name: pentox-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pentox
      POSTGRES_PASSWORD: pentox_dev_pass
      POSTGRES_DB: pentox
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pentox_pgdata:/var/lib/postgresql/data
volumes:
  pentox_pgdata: